# Project style configuration with RuboCop.
# Documentation: https://docs.rubocop.org/rubocop/configuration

plugins:
  - rubocop-rake

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

# Project conventions -------------------------------------------------
# The source code uses 4-space indentation.
Layout/IndentationWidth:
  Enabled: true
  Width: 4

Layout/IndentationConsistency:
  EnforcedStyle: normal

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

# Double-quoted strings, in line with the frozen_string_literal convention.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Allows alignment of assignments (e.g.: r2.gemspec).
Layout/ExtraSpacing:
  AllowForAlignment: true

# LF line endings to guarantee gem portability.
Layout/EndOfLine:
  EnforcedStyle: lf

# Development dependencies are centralized in the gemspec.
Gemspec/DevelopmentDependencies:
  Enabled: false

# "Skeleton" classes not yet implemented do not generate warnings.
Lint/EmptyClass:
  Enabled: false
Style/EmptyClassDefinition:
  Enabled: false

# Tests are structured in responsibility blocks (RSpec).
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "**/*.gemspec"

# Test support modules concentrate scenario utilities.
Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"

# Methods with multiple error conversion clauses may be slightly longer.
Metrics/MethodLength:
  Max: 15
